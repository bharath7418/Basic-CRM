<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Tech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand font-weight-bold" href="#">Alpha Tech</a>
            <a href="/login" class="btn btn-outline-light btn-sm">Admin Access</a>
        </div>
    </nav>

    <div class="container">
        {% with messages = get_flashed_messages() %}
          {% if messages %}{% for m in messages %}<div class="alert alert-success">{{ m }}</div>{% endfor %}{% endif %}
        {% endwith %}

        <div class="row">
            <div class="col-md-8">
                <h2 class="mb-4">Upcoming Events</h2>
                {% for e in events %}
                <div class="card mb-3 shadow-sm">
                    <div class="card-body">
                        <h4 class="card-title text-primary">{{ e.title }}</h4>
                        <h6 class="card-subtitle mb-2 text-muted">{{ e.date }} | {{ e.location }}</h6>
                        <p class="card-text">{{ e.description }}</p>
                    </div>
                </div>
                {% endfor %}
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h4 class="mb-3">Contact Us</h4>
                        <form action="/contact" method="POST">
                            <input type="text" name="name" class="form-control mb-2" placeholder="Your Name" required>
                            <input type="email" name="email" class="form-control mb-2" placeholder="Your Email" required>
                            <textarea name="content" class="form-control mb-3" placeholder="How can we help?" rows="4" required></textarea>
                            <button class="btn btn-primary w-100">Send Message</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
